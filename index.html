<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores Opex 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1e2333;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0; --muted: #7a7f9a;
    --blue: #4f8ef7; --teal: #2dd4a0; --amber: #f5a623; --red: #f06565;
    --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  .top-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap; }
  .top-bar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .top-bar h1 span { color: var(--blue); }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .top-date { font-size: 12px; color: var(--muted); font-family: var(--mono); }

  .btn-refresh { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border2); color: var(--text); font-family: var(--font); font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .btn-refresh:hover { background: var(--surface2); border-color: var(--blue); color: var(--blue); }
  .btn-refresh:disabled { opacity: .5; cursor: not-allowed; }
  .btn-refresh .icon { width: 13px; height: 13px; transition: transform .6s; display: inline-block; }
  .btn-refresh.loading .icon { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-family: var(--mono); padding: 8px 32px; border-bottom: 1px solid var(--border); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--teal); }
  .dot.error { background: var(--red); }
  .dot.loading { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }

  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .filter-bar label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .filter-bar select { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: var(--font); font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer; outline: none; }
  .filter-bar select:focus { border-color: var(--blue); }
  .btn-reset { background: none; border: 1px solid var(--border2); color: var(--muted); font-family: var(--font); font-size: 12px; padding: 7px 14px; border-radius: 8px; cursor: pointer; margin-left: auto; transition: all .15s; }
  .btn-reset:hover { background: var(--surface2); color: var(--text); }

  .cards { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .card-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .card-val { font-size: 32px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin-bottom: 6px; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .c-blue{color:var(--blue)} .c-teal{color:var(--teal)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}

  .g2  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .panel-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 16px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
  .bar-lbl { width: 150px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-n { width: 30px; text-align: right; color: var(--muted); font-family: var(--mono); font-size: 11px; }

  .resp-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 8px 24px; }
  .resp-row { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--blue); flex-shrink: 0; font-family: var(--mono); }
  .resp-info { flex: 1; min-width: 0; }
  .resp-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .resp-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .resp-bar-fill { height: 100%; border-radius: 2px; background: var(--blue); opacity: .6; }
  .resp-n { font-size: 12px; color: var(--muted); font-family: var(--mono); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { text-align: left; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }
  .link-chave { color: var(--blue); text-decoration: none; font-family: var(--mono); font-size: 11px; }
  .link-chave:hover { text-decoration: underline; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 500; }
  .t-sim { background: rgba(45,212,160,.15); color: var(--teal); }
  .t-nao { background: rgba(240,101,101,.12); color: var(--red); }
  td.num { text-align: right; font-family: var(--mono); color: var(--muted); }

  .pagination { display: flex; gap: 4px; justify-content: flex-end; align-items: center; margin-top: 14px; }
  .pagination button { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 11px; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; transition: all .15s; }
  .pagination button.active, .pagination button:hover { background: var(--blue); color: #fff; border-color: transparent; }

  .skel { background: var(--surface2); border-radius: 8px; animation: sh 1.4s ease-in-out infinite; }
  @keyframes sh { 0%,100%{opacity:.4} 50%{opacity:.8} }

  ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.wrap{padding:16px}.top-bar,.status-bar{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>Indicadores <span>Opex</span> 2025</h1>
  <div class="top-right">
    <span class="top-date" id="today"></span>
    <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
      Atualizar dados
    </button>
  </div>
</div>

<div class="status-bar">
  <div class="dot" id="sdot"></div>
  <span id="smsg">Carregando dados da planilha...</span>
</div>

<div class="wrap">
  <div class="filter-bar">
    <label>BU</label><select id="f-bu" onchange="applyFilters()"><option value="">Todas</option></select>
    <label>Produto</label><select id="f-prod" onchange="applyFilters()"><option value="">Todos</option></select>
    <label>Responsável</label><select id="f-resp" onchange="applyFilters()"><option value="">Todos</option></select>
    <button class="btn-reset" onclick="resetFilters()">Limpar filtros</button>
  </div>

  <div class="cards">
    <div class="card"><div class="card-lbl">Total de solicitações</div><div class="card-val c-blue" id="c-total">—</div><div class="card-sub" id="c-total-sub">registros</div></div>
    <div class="card"><div class="card-lbl">Já resolvemos (Sim)</div><div class="card-val c-teal" id="c-sim">—</div><div class="card-sub" id="c-sim-pct">—</div></div>
    <div class="card"><div class="card-lbl">Não resolvido</div><div class="card-val c-red" id="c-nao">—</div><div class="card-sub" id="c-nao-pct">—</div></div>
    <div class="card"><div class="card-lbl">Média dias dev→conclusão</div><div class="card-val c-amber" id="c-dias">—</div><div class="card-sub">dias úteis</div></div>
  </div>

  <div class="g2">
    <div class="panel"><div class="panel-title">Top ações</div><div id="bars-acao"><div class="skel" style="height:160px"></div></div></div>
    <div class="panel"><div class="panel-title">Solicitações por BU</div><div id="bars-bu"><div class="skel" style="height:160px"></div></div></div>
  </div>

  <div class="panel" style="margin-bottom:12px">
    <div class="panel-title">Responsáveis</div>
    <div id="resp-list"><div class="skel" style="height:80px"></div></div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="panel-title" style="margin:0">Solicitações</div>
      <span id="tbl-info" style="font-size:11px;color:var(--muted);font-family:var(--mono)"></span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Chave</th><th>BU</th><th>Produto</th><th>Ação</th><th>Responsável</th><th>Criado</th><th>Conclusão</th><th style="text-align:right">Dias dev</th><th>Resolvemos?</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="9"><div class="skel" style="height:200px"></div></td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4szh0KgV8Jec6c2sV1oDmHxhvmKfKDVZDtTsEAfWa-6yv0T4yMInqkxPXTpsWEMdS_qvftKHBqRfe/pub?gid=1702950340&single=true&output=csv';
const PROXY   = 'https://corsproxy.io/?';
const PAGE_SIZE = 12;

let ALL = [], filtered = [], page = 0;

document.getElementById('today').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function setStatus(type, msg) {
  document.getElementById('sdot').className = 'dot' + (type==='ok'?'':' '+type);
  document.getElementById('smsg').textContent = msg;
}

function parseCSV(raw) {
  const lines = raw.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    const cols=[]; let cur='', inQ=false;
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=ch;
    }
    cols.push(cur.trim());
    const o={};
    headers.forEach((h,i)=>o[h]=(cols[i]||'').replace(/^"|"$/g,''));
    return o;
  }).filter(r=>r['Chave']&&r['Chave'].startsWith('BDC'));
}

function mapRow(r) {
  return {
    chave: r['Chave']||'',
    bu: r['BU']||'',
    produto: r['Produto']||'',
    acao: r['Ação']||r['A\u00e7\u00e3o']||'',
    opex_resolvido: r['Já resolvemos este Opex?']||r['J\u00e1 resolvemos este Opex?']||'',
    responsavel: r['Responsável']||r['Respons\u00e1vel']||'',
    criado: r['Criado em']||'',
    conclusao: r['Conclusão']||r['Conclus\u00e3o']||'',
    dias_dev: parseFloat(r['Dias Úteis (Dev→Conclusão)']||r['Dias \u00dateis (Dev\u2192Conclus\u00e3o)']||0)||0,
    link: r['Link']||''
  };
}

async function loadData() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.classList.add('loading');
  setStatus('loading','Buscando dados atualizados...');
  try {
    const res = await fetch(PROXY + encodeURIComponent(CSV_URL), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if(!rows.length) throw new Error('Planilha vazia ou sem dados');
    ALL = rows.map(mapRow);
    filtered = [...ALL];
    page = 0;
    populateFilters();
    render();
    const t = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    setStatus('ok', `${ALL.length} registros carregados · atualizado às ${t}`);
  } catch(e) {
    setStatus('error','Erro ao carregar: '+e.message+' — verifique se a planilha está publicada e tente novamente');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function populateFilters() {
  function fill(id, arr) {
    const el=document.getElementById(id), cur=el.value;
    while(el.options.length>1) el.remove(1);
    [...new Set(arr)].filter(Boolean).sort().forEach(v=>el.add(new Option(v,v)));
    if([...el.options].some(o=>o.value===cur)) el.value=cur;
  }
  fill('f-bu',   ALL.map(r=>r.bu));
  fill('f-prod', ALL.map(r=>r.produto));
  fill('f-resp', ALL.map(r=>r.responsavel));
}

function applyFilters() {
  const bu=document.getElementById('f-bu').value;
  const prod=document.getElementById('f-prod').value;
  const resp=document.getElementById('f-resp').value;
  filtered=ALL.filter(r=>(!bu||r.bu===bu)&&(!prod||r.produto===prod)&&(!resp||r.responsavel===resp));
  page=0; render();
}

function resetFilters() {
  ['f-bu','f-prod','f-resp'].forEach(id=>document.getElementById(id).value='');
  filtered=[...ALL]; page=0; render();
}

function cmap(arr,key){const m={};arr.forEach(r=>{if(r[key])m[r[key]]=(m[r[key]]||0)+1;});return m;}

function renderCards() {
  const n=filtered.length, sim=filtered.filter(r=>r.opex_resolvido==='Sim').length;
  const nao=filtered.filter(r=>r.opex_resolvido==='Não').length;
  const devs=filtered.filter(r=>r.dias_dev>0).map(r=>r.dias_dev);
  const avg=devs.length?devs.reduce((a,b)=>a+b,0)/devs.length:0;
  document.getElementById('c-total').textContent=n;
  document.getElementById('c-total-sub').textContent=filtered.length===ALL.length?'total de registros':'registros filtrados';
  document.getElementById('c-sim').textContent=sim;
  document.getElementById('c-sim-pct').textContent=n?Math.round(sim/n*100)+'% do total':'—';
  document.getElementById('c-nao').textContent=nao;
  document.getElementById('c-nao-pct').textContent=n?Math.round(nao/n*100)+'% do total':'—';
  document.getElementById('c-dias').textContent=avg.toFixed(1);
}

function renderBars(id, data, color) {
  const max=data[0]?.[1]||1;
  document.getElementById(id).innerHTML=data.map(([l,n])=>
    `<div class="bar-row"><span class="bar-lbl" title="${l}">${l}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%;background:${color}"></div></div><span class="bar-n">${n}</span></div>`
  ).join('');
}

function renderResp() {
  const m=Object.entries(cmap(filtered,'responsavel')).sort((a,b)=>b[1]-a[1]);
  const max=m[0]?.[1]||1;
  document.getElementById('resp-list').innerHTML='<div class="resp-grid">'+m.map(([r,n])=>{
    const ini=r.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `<div class="resp-row"><div class="avatar">${ini}</div><div class="resp-info"><div class="resp-name">${r}</div><div class="resp-bar"><div class="resp-bar-fill" style="width:${Math.round(n/max*100)}%"></div></div></div><span class="resp-n">${n}</span></div>`;
  }).join('')+'</div>';
}

function renderTable() {
  const start=page*PAGE_SIZE, slice=filtered.slice(start,start+PAGE_SIZE);
  document.getElementById('tbl-info').textContent=`${start+1}–${Math.min(start+PAGE_SIZE,filtered.length)} de ${filtered.length}`;
  document.getElementById('tbody').innerHTML=slice.map(r=>
    `<tr>
      <td><a class="link-chave" href="${r.link}" target="_blank">${r.chave}</a></td>
      <td>${r.bu}</td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.produto}">${r.produto}</td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.acao}">${r.acao}</td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.responsavel.split(' ').slice(0,2).join(' ')}</td>
      <td style="color:var(--muted);font-family:var(--mono);font-size:11px">${r.criado}</td>
      <td style="color:var(--muted);font-family:var(--mono);font-size:11px">${r.conclusao}</td>
      <td class="num">${r.dias_dev}</td>
      <td><span class="tag ${r.opex_resolvido==='Sim'?'t-sim':'t-nao'}">${r.opex_resolvido}</span></td>
    </tr>`
  ).join('');
  const total=Math.ceil(filtered.length/PAGE_SIZE);
  let pg='';
  for(let i=0;i<total;i++){
    if(i===0||i===total-1||Math.abs(i-page)<=1) pg+=`<button class="${i===page?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
    else if(Math.abs(i-page)===2) pg+=`<span style="color:var(--muted);font-size:12px">…</span>`;
  }
  document.getElementById('pagination').innerHTML=pg;
}

function goPage(n){page=n;renderTable();}

function render() {
  renderCards();
  renderBars('bars-acao', Object.entries(cmap(filtered,'acao')).sort((a,b)=>b[1]-a[1]).slice(0,8), 'var(--blue)');
  renderBars('bars-bu',   Object.entries(cmap(filtered,'bu')).sort((a,b)=>b[1]-a[1]), 'var(--teal)');
  renderResp();
  renderTable();
}

loadData();
</script>
</body>
</html>
